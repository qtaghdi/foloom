<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>DOCX 편집 | document-workspace</title>
  </head>
  <body class="m-0 min-h-dvh bg-slate-100 text-slate-900 antialiased">
    <a class="sr-only focus:not-sr-only" href="#document-content">본문으로 이동</a>
    <header class="sticky top-0 z-10 border-b border-blue-950 bg-blue-900 px-4 py-3 text-white shadow-sm">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3">
        <div class="min-w-0"><p class="text-xs text-blue-200">document-workspace · DOCX</p><h1 id="document-name" class="truncate text-base font-semibold">문서를 여는 중</h1></div>
        <div class="flex flex-wrap items-center gap-3">
          <p id="save-status" class="text-sm" role="status" aria-live="polite">연결 중</p>
          <button id="reload-document" class="min-h-11 rounded border border-blue-400 px-3 text-sm hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2" type="button">다시 불러오기</button>
          <button id="save-document" class="min-h-11 rounded bg-white px-4 text-sm font-semibold text-blue-900 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50" type="button" disabled>변경 저장</button>
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-5xl space-y-5 px-3 py-6 sm:px-6">
      <details class="rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-950"><summary class="cursor-pointer font-semibold">편집 범위와 원본 보존 안내</summary><ul id="document-warnings" class="mt-3 list-disc space-y-2 pl-5"></ul></details>
      <p class="text-sm text-slate-600">본문과 표의 텍스트를 수정한 뒤 ‘변경 저장’을 누르세요. 서식이 다른 텍스트는 별도 입력칸으로 표시됩니다. 줄바꿈과 탭은 현재 지원하지 않습니다.</p>
      <div id="document-error" class="hidden rounded-lg border border-red-300 bg-red-50 p-4 text-sm whitespace-pre-wrap text-red-900" role="alert"></div>
      <article id="document-content" aria-label="DOCX 본문과 표 편집" aria-busy="true" class="min-h-96 space-y-5 rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:p-10" tabindex="-1"></article>
    </main>
    <script type="module" src="/src/docx/main.ts"></script>
  </body>
</html>
