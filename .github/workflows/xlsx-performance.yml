name: XLSX performance verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Verify XLSX performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true
      - name: Verify CI performance profile
        run: make xlsx-performance-verify
