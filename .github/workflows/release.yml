name: Private alpha package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the unsigned alpha artifacts
        required: true
        default: 0.1.0-alpha.local

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned alpha archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true
      - name: Install exact frontend dependencies
        run: make web-install
      - name: Build and verify release archives
        run: make release-verify VERSION="${{ inputs.version }}"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foloom-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
