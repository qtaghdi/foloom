name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the unsigned alpha artifacts
        required: true
        default: 0.1.0-alpha.local
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build unsigned alpha archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true
      - name: Resolve package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "value=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Install exact frontend dependencies
        run: make web-install
      - name: Build and verify release archives
        run: make release-verify VERSION="${{ steps.version.outputs.value }}"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: document-workspace-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
      - name: Require distribution terms before public publication
        if: github.event_name == 'push'
        run: test -f LICENSE
      - name: Publish tagged prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          gh release create "$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          --verify-tag --prerelease --generate-notes
          --title "document-workspace $VERSION"
