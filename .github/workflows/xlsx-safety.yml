name: XLSX safety verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Verify XLSX safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
          cache: true
      - name: Verify XLSX safety gates
        run: make xlsx-safety-verify
