name: XLSX safety verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safety:
    name: Verify XLSX safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test CI scope rules
        run: node --test .github/scripts/check-scope.test.mjs
      - name: Select checks for changed files
        id: scope
        run: node .github/scripts/check-scope.mjs
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.safety == 'true'
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.safety == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.safety == 'true'
        with:
          go-version: 1.25.0
          cache: true
      - name: Verify XLSX safety gates
        if: steps.scope.outputs.safety == 'true'
        run: make xlsx-safety-verify
