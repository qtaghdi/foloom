name: XLSX full regression verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Verify full XLSX regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test CI scope rules
        run: node --test .github/scripts/check-scope.test.mjs
      - name: Select checks for changed files
        id: scope
        run: node .github/scripts/check-scope.mjs
      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.regression == 'true' || steps.scope.outputs.docx == 'true'
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.regression == 'true' || steps.scope.outputs.docx == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.regression == 'true' || steps.scope.outputs.docx == 'true'
        with:
          go-version: 1.25.0
          cache: true
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.regression == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: legacy/xlsx-python/requirements.txt
      - name: Install pinned legacy regression dependencies
        if: steps.scope.outputs.regression == 'true'
        run: python -m pip install --requirement legacy/xlsx-python/requirements.txt
      - name: Install frozen browser dependencies
        if: steps.scope.outputs.regression == 'true' || steps.scope.outputs.docx == 'true'
        run: make web-install
      - name: Verify frontend, Go, race, vet, and legacy regression suites
        if: steps.scope.outputs.regression == 'true'
        run: make verify
      - name: Verify DOCX without XLSX regression gates
        if: steps.scope.outputs.docx == 'true' && steps.scope.outputs.regression != 'true'
        run: make docx-verify
