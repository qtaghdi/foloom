name: Pull request checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select checks for changed files
    runs-on: ubuntu-latest
    outputs:
      regression: ${{ steps.scope.outputs.regression }}
      docx: ${{ steps.scope.outputs.docx }}
      web: ${{ steps.scope.outputs.web }}
      safety: ${{ steps.scope.outputs.safety }}
      performance: ${{ steps.scope.outputs.performance }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/check-scope.test.mjs
      - id: scope
        run: node .github/scripts/check-scope.mjs

  regression:
    needs: scope
    if: needs.scope.outputs.regression == 'true'
    uses: ./.github/workflows/xlsx-quality.yml

  editor_package:
    name: Verify editor and package
    needs: scope
    if: needs.scope.outputs.package == 'true' || (needs.scope.outputs.regression != 'true' && (needs.scope.outputs.docx == 'true' || needs.scope.outputs.web == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
        if: needs.scope.outputs.docx == 'true' || needs.scope.outputs.package == 'true'
      - name: Verify selected editor and package targets
        env:
          DOCX: ${{ needs.scope.outputs.docx }}
          WEB: ${{ needs.scope.outputs.web }}
          PACKAGE: ${{ needs.scope.outputs.package }}
          REGRESSION: ${{ needs.scope.outputs.regression }}
        run: |
          targets=(web-install)
          if [[ "$REGRESSION" != true && "$DOCX" == true ]]; then targets+=(docx-verify); fi
          if [[ "$REGRESSION" != true && "$WEB" == true ]]; then targets+=(web-test); fi
          if [[ "$PACKAGE" == true ]]; then targets+=(package-verify release-package-test); fi
          make "${targets[@]}"

  safety:
    needs: scope
    if: needs.scope.outputs.safety == 'true'
    uses: ./.github/workflows/xlsx-safety.yml

  performance:
    needs: scope
    if: needs.scope.outputs.performance == 'true'
    uses: ./.github/workflows/xlsx-performance.yml

  result:
    name: Verify selected PR checks
    if: always()
    needs: [scope, regression, editor_package, safety, performance]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require selected jobs to succeed
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const scope = jobs.scope;
          const names = ['regression', 'docx', 'web', 'safety', 'performance', 'package'];
          if (scope.result !== 'success' || names.some(name => !['true', 'false'].includes(scope.outputs[name]))) {
            throw new Error('CI scope could not be determined');
          }
          const selected = Object.fromEntries(names.map(name => [name, scope.outputs[name] === 'true']));
          const expectedJobs = {
            regression: selected.regression,
            editor_package: selected.package || (!selected.regression && (selected.docx || selected.web)),
            safety: selected.safety,
            performance: selected.performance,
          };
          for (const [name, required] of Object.entries(expectedJobs)) {
            const expected = required ? 'success' : 'skipped';
            if (jobs[name]?.result !== expected) throw new Error(`${name}: expected ${expected}, got ${jobs[name]?.result}`);
          }
          JS
