name: Pull request checks

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select checks for changed files
    runs-on: ubuntu-latest
    outputs:
      regression: ${{ steps.scope.outputs.regression }}
      docx: ${{ steps.scope.outputs.docx }}
      web: ${{ steps.scope.outputs.web }}
      safety: ${{ steps.scope.outputs.safety }}
      performance: ${{ steps.scope.outputs.performance }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/check-scope.test.mjs
      - id: scope
        run: node .github/scripts/check-scope.mjs

  regression:
    needs: scope
    if: needs.scope.outputs.regression == 'true'
    uses: ./.github/workflows/xlsx-quality.yml

  docx:
    name: Verify DOCX
    needs: scope
    if: needs.scope.outputs.docx == 'true' && needs.scope.outputs.regression != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.0
      - run: make web-install docx-verify

  web:
    name: Verify browser editor
    needs: scope
    if: needs.scope.outputs.web == 'true' && needs.scope.outputs.regression != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make web-install web-test

  safety:
    needs: scope
    if: needs.scope.outputs.safety == 'true'
    uses: ./.github/workflows/xlsx-safety.yml

  performance:
    needs: scope
    if: needs.scope.outputs.performance == 'true'
    uses: ./.github/workflows/xlsx-performance.yml

  package:
    needs: scope
    if: needs.scope.outputs.package == 'true'
    uses: ./.github/workflows/package.yml

  result:
    name: Verify selected PR checks
    if: always()
    needs: [scope, regression, docx, web, safety, performance, package]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require selected jobs to succeed
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const scope = jobs.scope;
          const names = ['regression', 'docx', 'web', 'safety', 'performance', 'package'];
          if (scope.result !== 'success' || names.some(name => !['true', 'false'].includes(scope.outputs[name]))) {
            throw new Error('CI scope could not be determined');
          }
          for (const name of names) {
            const covered = ['docx', 'web'].includes(name) && scope.outputs.regression === 'true';
            const expected = scope.outputs[name] === 'true' && !covered ? 'success' : 'skipped';
            if (jobs[name].result !== expected) throw new Error(`${name}: expected ${expected}, got ${jobs[name].result}`);
          }
          JS
