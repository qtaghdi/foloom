name: 버그 신고
description: 재현 가능한 잘못된 동작이나 회귀를 신고합니다.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 발생한 현상과 잘못된 이유를 설명하세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 안정적으로 재현하는 최소 단계를 적어 주세요.
      placeholder: |
        1. 다음과 같이 서비스를 실행합니다...
        2. 다음을 엽니다...
        3. 다음을 편집합니다...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향
      description: 데이터 안전성, 호환성, 보안, 작업 흐름에 미치는 영향을 설명하세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 버그를 닫기 위해 필요한 회귀 검사와 관찰 가능한 동작을 적으세요.
      placeholder: |
        - [ ] 회귀 테스트가 수정 전에는 실패하고 수정 후에는 통과합니다.
        - [ ] 대상 동작 외의 기존 문서 내용은 바뀌지 않습니다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 공유해도 안전한 OS, Go, Node.js, 브라우저, MCP 호스트, 통합 문서 정보를 적으세요.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 통합 문서 및 XLSX
        - 브라우저 UI
        - MCP 도구
        - 실시간 이벤트
        - 인증 및 보안
        - 빌드 및 배포
        - 문서
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 또는 화면 캡처
      description: 통합 문서 내용, 인증 정보, 토큰, 개인정보를 제거하세요.
  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 별도로 추적해야 하는 관련 작업을 적으세요.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 데이터 안전
      options:
        - label: 비밀 정보, bearer token, 비공개 통합 문서 데이터를 제거했습니다.
          required: true
