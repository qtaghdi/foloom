name: 기능 제안
description: 범위가 분명한 제품 또는 엔지니어링 개선을 제안합니다.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 해결책보다 사용자 또는 시스템 문제를 먼저 설명하세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 관찰 가능한 동작과 완료 조건을 설명하세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이슈를 닫기 전에 충족해야 하는 관찰 가능한 조건을 적으세요.
      placeholder: |
        - [ ] 사용자가 ...할 수 있습니다.
        - [ ] 자동 테스트가 ...을 입증합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 바뀔 동작, 경계, 파일 또는 시스템을 적으세요.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 제외 범위
      description: 이 이슈에 포함하지 않을 관련 작업을 적으세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 방식
      description: 선택 사항인 구현 또는 아키텍처 메모입니다.
  - type: textarea
    id: evidence
    attributes:
      label: 검증 및 증거
      description: 필요한 자동 검사, 수동 확인, fixture, 호스트 증거를 설명하세요.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 통합 문서 및 XLSX
        - 브라우저 UI
        - MCP 도구
        - 실시간 협업
        - 인증 및 보안
        - 빌드 및 배포
        - 문서
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 제약 조건
      options:
        - label: 제안은 Univer Pro 패키지나 서비스 없이 동작합니다.
          required: true
        - label: 내장 UI를 사용할 수 없어도 MCP 도구가 유용하게 동작합니다.
          required: true
