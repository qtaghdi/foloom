<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#065f46" />
    <title>document-workspace</title>
    <script type="module" crossorigin src="/assets/index-CFjQ1Ar9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CuRvtepV.css">
  </head>
  <body class="m-0 h-dvh overflow-hidden bg-slate-100 text-slate-900 antialiased">
    <a class="skip-link" href="#spreadsheet">Skip to workbook</a>
    <div id="app-shell" class="grid h-full grid-rows-[auto_minmax(0,1fr)] overflow-hidden">
      <header class="app-toolbar z-10 flex min-h-12 flex-wrap items-center justify-between gap-2 border-b border-emerald-900 bg-emerald-800 text-emerald-50">
        <div class="flex min-w-0 items-center gap-2.5">
          <span class="grid size-5 grid-cols-3 grid-rows-3 gap-px rounded-[3px] border border-white bg-emerald-100 p-[3px]" aria-hidden="true">
            <i class="bg-emerald-700"></i><i class="bg-emerald-700"></i><i class="bg-emerald-700"></i>
            <i class="bg-emerald-700"></i><i class="bg-emerald-700"></i><i class="bg-emerald-700"></i>
            <i class="bg-emerald-700"></i><i class="bg-emerald-700"></i><i class="bg-emerald-700"></i>
          </span>
          <div class="grid min-w-0">
            <strong id="workbook-name" class="overflow-hidden text-sm leading-[18px] text-ellipsis whitespace-nowrap">Opening workbook</strong>
            <span id="revision-status" class="revision-status text-[11px] leading-3.5 text-emerald-200" role="status" aria-live="polite" aria-atomic="true" data-state="pending">Connecting…</span>
          </div>
        </div>
        <div class="toolbar-actions flex min-w-0 shrink-0 items-center gap-2">
          <div class="flex items-center gap-1" role="toolbar" aria-label="Workbook history">
            <button id="history-undo" class="min-h-11 min-w-11 touch-manipulation rounded border border-emerald-600 bg-emerald-700 px-2 py-1 text-xs font-medium text-white enabled:hover:bg-emerald-600 enabled:active:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:opacity-40" type="button" title="Undo (Ctrl+Z or Command+Z)" disabled>Undo</button>
            <button id="history-redo" class="min-h-11 min-w-11 touch-manipulation rounded border border-emerald-600 bg-emerald-700 px-2 py-1 text-xs font-medium text-white enabled:hover:bg-emerald-600 enabled:active:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white disabled:cursor-not-allowed disabled:opacity-40" type="button" title="Redo (Ctrl+Y or Command+Shift+Z)" disabled>Redo</button>
          </div>
          <div id="ai-presence" class="ai-presence hidden min-w-0 max-w-[42vw] shrink items-center gap-2 rounded-full border border-violet-300 bg-violet-50 px-2.5 py-1 text-xs text-violet-950" role="status" aria-live="polite" aria-atomic="true">
            <span class="size-2 shrink-0 rounded-full bg-violet-600 ring-3 ring-violet-200" aria-hidden="true"></span>
            <span id="ai-presence-text" class="overflow-hidden text-ellipsis whitespace-nowrap">AI is ready</span>
          </div>
        </div>
      </header>
      <main id="spreadsheet" class="min-h-0 min-w-0" aria-label="Workbook editor" tabindex="-1" aria-busy="true"></main>
      <div id="feature-warnings" class="status-panel fixed z-20 hidden max-h-[40dvh] max-w-4xl overflow-auto rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm break-words text-amber-950 shadow-xl" role="status" aria-live="polite"></div>
      <div id="fatal-error" class="status-panel fixed z-20 hidden max-h-[60dvh] max-w-3xl overflow-auto rounded-lg border border-red-200 bg-red-50 px-4 py-3.5 break-words text-red-900 shadow-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700" role="alert" aria-live="assertive" tabindex="-1"></div>
    </div>
  </body>
</html>
